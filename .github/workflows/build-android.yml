name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - narnia_games
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          # Copy all relevant assets to the www directory
          cp -r css js img mp3s www/ || true
          # Specifically copy math_kombat.html as index.html so the app boots into it
          cp math_kombat.html www/index.html
          echo "Web directory prepared."

      - name: Capacitor Sync
        run: |
          npx cap add android || npx cap sync android

      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: math-kombat-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
